name: Android APK Build & Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a new GitHub Release with APK'
        required: false
        type: boolean
        default: true

jobs:
  build-apk:
    name: Build ALL IN ONE SHOP APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Prepare Android Keystore and Environment Config
        run: |
          touch .env
          if [ ! -f debug.keystore ]; then
            echo "Generating Android debug keystore..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=ALL IN ONE SHOP,OU=Retail,O=AllInOneShop,L=Ragadi,ST=Odisha,C=IN"
          fi

      - name: Verify Gradle Setup
        run: ./gradlew tasks --group=build

      - name: Build Android Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare APK Distribution Package
        run: |
          mkdir -p build/dist
          cp app/build/outputs/apk/debug/app-debug.apk build/dist/ALL-IN-ONE-SHOP-debug.apk
          echo "=================================================="
          echo "Build successful! Generated APK:"
          ls -lh build/dist/ALL-IN-ONE-SHOP-debug.apk
          echo "Package: com.allinoneshop.app"
          echo "=================================================="

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALL-IN-ONE-SHOP-debug-apk
          path: build/dist/ALL-IN-ONE-SHOP-debug.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release))
        uses: softprops/action-gh-release@v2
        with:
          name: ALL IN ONE SHOP Android Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          files: build/dist/ALL-IN-ONE-SHOP-debug.apk
          body: |
            ## 🛍️ ALL IN ONE SHOP — Native Android Application
            **Ragadi Bazar, Jajpur Road, Odisha - 755019**
            
            ### 📱 Release Information:
            - **Package Name:** `com.allinoneshop.app`
            - **Version:** `1.0` (Code: 1)
            - **Target:** Android 7.0+ (Min SDK: 24, Target SDK: 36)
            - **Service Coverage:** 15 KM Radius express delivery from Ragadi store.
            
            ### ⬇️ Installation Instructions:
            1. Download `ALL-IN-ONE-SHOP-debug.apk` attached below.
            2. Open the `.apk` on your Android phone.
            3. Tap **Settings** and toggle **"Allow from this source"** if prompted.
            4. Tap **Install** and enjoy shopping!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
